<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICTクラフト部 ローカル連絡システム</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for essential icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PeerJS for WebRTC P2P Signaling -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <script>
    // Tailwind Config - strictly limiting to max 4 functional colors, no purple/indigo
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
          },
          colors: {
            // Palette restriction: Neutral Slate + Primary Blue + Accent Green + Alert Red
            brand: {
              blue: '#2563eb',    // Primary action / accent
              green: '#059669',   // Connected / Success / Answer
              red: '#dc2626',     // Disconnect / Reject / Hangup
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Continuous pulse animation for active calling state */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-ring {
      animation: pulse-ring 1.8s infinite ease-in-out;
    }

    /* Scrollbar styling for message history */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(113, 113, 122, 0.4);
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-100 text-slate-800 dark:bg-zinc-900 dark:text-zinc-100 transition-colors duration-200">

  <!-- Header Section -->
  <header class="bg-white dark:bg-zinc-800 border-b border-slate-200 dark:border-zinc-700 px-4 py-3 flex items-center justify-between shrink-0 shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-lg shadow">
        <i class="fa-solid fa-network-wired"></i>
      </div>
      <div>
        <h1 class="font-bold text-base md:text-lg leading-tight flex items-center gap-2">
          ICTクラフト部 連絡システム
        </h1>
        <p class="text-xs text-slate-500 dark:text-zinc-400">作業室間 ワンステップ連絡ツール</p>
      </div>
    </div>

    <!-- Status Badge, Theme Toggle & Disconnect -->
    <div class="flex items-center gap-2 md:gap-3">
      <div id="statusBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-200 dark:bg-zinc-700 text-slate-700 dark:text-zinc-300 text-xs font-medium">
        <span class="w-2 h-2 rounded-full bg-slate-400"></span>
        <span id="statusText">未接続</span>
      </div>

      <!-- Theme Switch Button -->
      <button id="themeToggleBtn" class="p-2 rounded-lg text-slate-600 dark:text-zinc-300 hover:bg-slate-200 dark:hover:bg-zinc-700 transition text-sm" title="テーマ切り替え">
        <i class="fa-solid fa-moon dark:hidden"></i>
        <i class="fa-solid fa-sun hidden dark:block"></i>
      </button>

      <!-- Disconnect Active Peer Button -->
      <button id="disconnectBtn" class="hidden px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-lg transition flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-plug-circle-xmark"></i>
        <span class="hidden sm:inline">切断</span>
      </button>
    </div>
  </header>

  <!-- Connection Bar (One-Step Room Code) -->
  <section class="bg-slate-200/70 dark:bg-zinc-800/80 border-b border-slate-300 dark:border-zinc-700 px-4 py-2.5 shrink-0 flex flex-wrap items-center justify-between gap-3">
    <!-- Local Room Code -->
    <div class="flex items-center gap-2 text-xs md:text-sm">
      <span class="text-slate-600 dark:text-zinc-400 font-medium">自分のコード:</span>
      <span id="myRoomCode" class="font-mono font-bold text-blue-600 dark:text-blue-400 bg-white dark:bg-zinc-900 px-2.5 py-1 rounded border border-slate-300 dark:border-zinc-700 tracking-wider">------</span>
      <button id="copyCodeBtn" class="p-1.5 text-slate-600 dark:text-zinc-400 hover:text-blue-600 dark:hover:text-blue-400 transition" title="コードをコピー">
        <i class="fa-regular fa-copy"></i>
      </button>
    </div>

    <!-- Peer Connect Form -->
    <div id="connectForm" class="flex items-center gap-2 flex-1 max-w-sm">
      <input 
        type="text" 
        id="targetCodeInput" 
        placeholder="相手の6桁コードを入力" 
        maxlength="10"
        class="w-full uppercase font-mono bg-white dark:bg-zinc-900 border border-slate-300 dark:border-zinc-700 focus:border-blue-600 rounded-lg px-3 py-1.5 text-xs md:text-sm focus:outline-none transition"
      />
      <button id="connectBtn" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs md:text-sm font-semibold rounded-lg transition whitespace-nowrap shadow-sm flex items-center gap-1.5">
        <i class="fa-solid fa-link"></i>
        <span>接続</span>
      </button>
    </div>
  </section>

  <!-- Main Grid Container -->
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

    <!-- Video & Call Area -->

      <!-- Video Screen Wrapper -->
      <div class="relative w-full h-full max-w-4xl flex items-center justify-center rounded-xl overflow-hidden bg-slate-200/70 dark:bg-zinc-950 border border-slate-300 dark:border-zinc-800 shadow-sm transition-colors duration-200">
        
        <!-- Remote Stream -->
        <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover hidden bg-black"></video>

        <!-- Placeholder when video is not active -->
        <div id="videoPlaceholder" class="flex flex-col items-center justify-center gap-3 p-6 text-center">
          <div class="w-20 h-20 md:w-24 md:h-24 rounded-full bg-white dark:bg-zinc-800 border border-slate-300 dark:border-zinc-700 flex items-center justify-center text-slate-500 dark:text-zinc-400 text-3xl md:text-4xl shadow-sm relative">
            <i class="fa-solid fa-headset"></i>
            <div id="activeCallRing" class="absolute inset-0 rounded-full border-2 border-emerald-500/50 pulse-ring hidden"></div>
          </div>
          <div>

            <p id="callStatusSubtext" class="text-xs text-slate-500 dark:text-zinc-400 mt-1">上部バーから相手のコードを入力して接続してください</p>

        <!-- Local Self Video Overlay -->
        <div id="localVideoWrapper" class="absolute bottom-3 right-3 w-28 h-20 md:w-44 md:h-32 rounded-lg overflow-hidden border border-blue-500/60 shadow-lg bg-zinc-900 hidden">

          <span class="absolute bottom-1 left-1.5 text-[10px] bg-zinc-900/80 px-1.5 py-0.5 rounded text-zinc-300">自分</span>
        </div>

        <!-- In-Call Control Toolbar -->
        <div id="inCallControls" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex items-center gap-3 bg-white/90 dark:bg-zinc-900/90 border border-slate-300 dark:border-zinc-700 px-4 py-2 rounded-full shadow-xl hidden backdrop-blur">
          <button id="toggleMicBtn" class="w-10 h-10 rounded-full bg-white dark:bg-zinc-800 text-slate-700 dark:text-zinc-200 flex items-center justify-center transition border border-slate-300 dark:border-zinc-700 shadow-sm" title="マイク ON/OFF">
            <i class="fa-solid fa-microphone text-sm"></i>
          </button>
          <button id="toggleCamBtn" class="w-10 h-10 rounded-full bg-white dark:bg-zinc-800 text-slate-700 dark:text-zinc-200 flex items-center justify-center transition border border-slate-300 dark:border-zinc-700 shadow-sm" title="カメラ ON/OFF">
            <i class="fa-solid fa-video text-sm"></i>
          </button>
          <button id="hangupBtn" class="w-10 h-10 rounded-full bg-red-600 hover:bg-red-700 text-white flex items-center justify-center transition shadow" title="通話を終了">
            <i class="fa-solid fa-phone-slash text-sm"></i>
          </button>
        </div>

      </div>

      <!-- Quick Call Initiation Actions -->
      <div id="callTriggerBar" class="mt-3 flex items-center gap-3 opacity-50 pointer-events-none transition-all">
        <button id="startAudioCallBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold text-xs md:text-sm transition flex items-center gap-2 shadow">
          <i class="fa-solid fa-phone"></i>
          <span>音声通話で呼び出す</span>
        </button>
        <button id="startVideoCallBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-semibold text-xs md:text-sm transition flex items-center gap-2 shadow">
          <i class="fa-solid fa-video"></i>
          <span>ビデオ通話で呼び出す</span>
        </button>
      </div>

    </section>

    <!-- Chat Sidebar -->
    <section class="w-full md:w-80 lg:w-88 bg-white dark:bg-zinc-800/90 border-t md:border-t-0 md:border-l border-slate-200 dark:border-zinc-700 flex flex-col h-64 md:h-full shrink-0">
      
      <!-- Chat Header -->
      <div class="px-4 py-2.5 border-b border-slate-200 dark:border-zinc-700 flex items-center justify-between bg-slate-50 dark:bg-zinc-800">
        <div class="flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-zinc-300">
          <i class="fa-regular fa-comment-dots text-blue-600 dark:text-blue-400"></i>
          <span>作業指示・連絡チャット</span>
        </div>
        <button id="clearChatBtn" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-zinc-200 transition" title="履歴消去">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>

      <!-- Messages Log -->
      <div id="chatMessages" class="flex-1 p-3 overflow-y-auto space-y-2 text-xs md:text-sm flex flex-col">
        <div class="text-center text-xs text-slate-400 my-auto py-4">
          <i class="fa-solid fa-comments text-slate-300 dark:text-zinc-600 text-2xl mb-2 block"></i>
          接続完了後、作業指示やテキストメッセージをリアルタイムでやり取りできます
        </div>
      </div>

      <!-- Chat Input -->
      <form id="chatForm" class="p-2.5 bg-slate-50 dark:bg-zinc-800 border-t border-slate-200 dark:border-zinc-700 flex items-center gap-2">
        <input 
          type="text" 
          id="chatInput" 
          placeholder="指示・メッセージを入力..." 
          disabled
          class="flex-1 bg-white dark:bg-zinc-900 border border-slate-300 dark:border-zinc-700 rounded-lg px-3 py-2 text-xs md:text-sm focus:outline-none focus:border-blue-600 transition disabled:opacity-50 disabled:cursor-not-allowed"
        />
        <button 
          type="submit" 
          id="sendMsgBtn" 
          disabled
          class="w-9 h-9 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 dark:disabled:bg-zinc-700 text-white rounded-lg flex items-center justify-center transition shadow-sm disabled:shadow-none shrink-0"
        >
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </form>

    </section>

  </main>

  <!-- Modals for Incoming & Outgoing Calls -->
  <!-- Outgoing Call Modal -->
  <div id="outgoingCallModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-2xl max-w-xs w-full p-6 shadow-2xl flex flex-col items-center text-center space-y-5">
      
      <div class="relative flex items-center justify-center">
        <div class="w-20 h-20 rounded-full bg-blue-500/20 border border-blue-500/40 absolute pulse-ring"></div>
        <div class="w-16 h-16 rounded-full bg-blue-600 flex items-center justify-center text-white text-2xl shadow z-10">
          <i id="outgoingCallIcon" class="fa-solid fa-phone"></i>
        </div>
      </div>

      <div>
        <h3 class="text-base font-bold">通話を呼び出し中...</h3>
        <p id="outgoingCallType" class="text-xs text-slate-500 dark:text-zinc-400 mt-1">相手の応答を待っています（音量が鳴っています）</p>
      </div>

      <button id="cancelCallBtn" class="w-full py-2.5 bg-slate-200 dark:bg-zinc-700 hover:bg-slate-300 dark:hover:bg-zinc-600 text-red-600 dark:text-red-400 text-xs font-semibold rounded-lg transition">
        呼び出しキャンセル
      </button>

    </div>
  </div>

  <!-- Incoming Call Modal -->
  <div id="incomingCallModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-2xl max-w-xs w-full p-6 shadow-2xl flex flex-col items-center text-center space-y-5">
      
      <div class="relative flex items-center justify-center">
        <div class="w-20 h-20 rounded-full bg-emerald-500/20 border border-emerald-500/40 absolute pulse-ring"></div>
        <div class="w-16 h-16 rounded-full bg-emerald-600 flex items-center justify-center text-white text-2xl shadow z-10">
          <i id="incomingCallIcon" class="fa-solid fa-phone-volume"></i>
        </div>
      </div>

      <div>
        <h3 class="text-base font-bold">着信中！</h3>
        <p id="incomingCallType" class="text-xs text-slate-500 dark:text-zinc-400 mt-1">相手から通話の呼び出しがあります</p>
      </div>

      <div class="grid grid-cols-2 gap-3 w-full">
        <button id="rejectCallBtn" class="py-2.5 bg-red-600/10 hover:bg-red-600/20 border border-red-500/30 text-red-600 dark:text-red-400 text-xs font-semibold rounded-lg transition">
          拒否する
        </button>
        <button id="acceptCallBtn" class="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition shadow">
          応答（開始）
        </button>
      </div>

    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-4 left-4 bg-slate-800 text-white px-3 py-2 rounded-lg shadow-lg text-xs flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
    <i id="toastIcon" class="fa-solid fa-circle-info text-blue-400"></i>
    <span id="toastMsg">メッセージ</span>
  </div>

  <script>
    /* Continuous Audio Synthesizer for Calling & Ringing Sound Effects */
    class ToneSynthesizer {
      constructor() {
        this.ctx = null;
        this.timer = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Continuous loop ringing tone for incoming calls
      startIncomingRingtone() {
        this.init();
        this.stop();
        if (!this.ctx) return;

        let flag = false;
        const playStep = () => {
          if (!this.ctx) return;
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc1.type = 'sine';
          osc2.type = 'sine';
          
          // Japanese standard phone ring frequency simulation
          osc1.frequency.setValueAtTime(400, this.ctx.currentTime);
          osc2.frequency.setValueAtTime(15, this.ctx.currentTime); // Modulation

          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.0);

          osc1.connect(gain);
          gain.connect(this.ctx.destination);

          osc1.start();
          osc1.stop(this.ctx.currentTime + 1.0);
        };

        playStep();
        this.timer = setInterval(playStep, 2000); // Repeat every 2 seconds continuously
      }

      // Continuous calling tone for caller side
      startOutgoingCallingTone() {
        this.init();
        this.stop();
        if (!this.ctx) return;

        const playStep = () => {
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.0);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + 1.0);
        };

        playStep();
        this.timer = setInterval(playStep, 3000); // Repeat every 3 seconds continuously
      }

      stop() {
        if (this.timer) {
          clearInterval(this.timer);
          this.timer = null;
        }
      }
    }

    const soundEffect = new ToneSynthesizer();

    // Global Application State
    let peer = null;
    let myPeerId = '';
    let dataConn = null;
    let mediaCall = null;
    let localStream = null;
    let activeCallType = null; // 'audio' or 'video'
    let isMicMuted = false;
    let isCamOff = false;

    // Generate random 6-character clean room code
    function generateRoomCode() {
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      let result = '';
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    // Theme Management
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    
    function initTheme() {
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    themeToggleBtn.addEventListener('click', () => {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
      }
    });

    initTheme();

    // DOM References
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const myRoomCodeEl = document.getElementById('myRoomCode');
    const copyCodeBtn = document.getElementById('copyCodeBtn');
    const targetCodeInput = document.getElementById('targetCodeInput');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');

    // Video & Call DOMs
    const remoteVideo = document.getElementById('remoteVideo');
    const localVideo = document.getElementById('localVideo');
    const localVideoWrapper = document.getElementById('localVideoWrapper');
    const videoPlaceholder = document.getElementById('videoPlaceholder');
    const peerDisplayName = document.getElementById('peerDisplayName');
    const callStatusSubtext = document.getElementById('callStatusSubtext');
    const activeCallRing = document.getElementById('activeCallRing');
    const callTriggerBar = document.getElementById('callTriggerBar');

    const startAudioCallBtn = document.getElementById('startAudioCallBtn');
    const startVideoCallBtn = document.getElementById('startVideoCallBtn');
    const inCallControls = document.getElementById('inCallControls');
    const toggleMicBtn = document.getElementById('toggleMicBtn');
    const toggleCamBtn = document.getElementById('toggleCamBtn');
    const hangupBtn = document.getElementById('hangupBtn');

    // Modals
    const outgoingCallModal = document.getElementById('outgoingCallModal');
    const outgoingCallType = document.getElementById('outgoingCallType');
    const outgoingCallIcon = document.getElementById('outgoingCallIcon');
    const cancelCallBtn = document.getElementById('cancelCallBtn');

    const incomingCallModal = document.getElementById('incomingCallModal');
    const incomingCallType = document.getElementById('incomingCallType');
    const incomingCallIcon = document.getElementById('incomingCallIcon');
    const acceptCallBtn = document.getElementById('acceptCallBtn');
    const rejectCallBtn = document.getElementById('rejectCallBtn');

    // Chat DOMs
    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const sendMsgBtn = document.getElementById('sendMsgBtn');
    const clearChatBtn = document.getElementById('clearChatBtn');

    // Notification Helper
    function showToast(msg, icon = 'fa-circle-info') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      
      toastMsg.textContent = msg;
      toastIcon.className = `fa-solid ${icon} text-blue-400`;
      
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    function setConnectionStatus(status, peerId = '') {
      if (status === 'connected') {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-xs font-medium border border-emerald-500/30';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-emerald-500';
        statusText.textContent = `接続中 (${peerId})`;
      
        peerDisplayName.textContent = `相手: ${peerId}`;
        callStatusSubtext.textContent = '呼び出しボタンを押して通話を開始できます';

        chatInput.disabled = false;
        sendMsgBtn.disabled = false;
        callTriggerBar.classList.remove('opacity-50', 'pointer-events-none');
        disconnectBtn.classList.remove('hidden');
      } else if (status === 'connecting') {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-amber-500/10 text-amber-600 dark:text-amber-400 text-xs font-medium border border-amber-500/30';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse';
        statusText.textContent = '接続中...';
      } else {
        statusBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-200 dark:bg-zinc-700 text-slate-700 dark:text-zinc-300 text-xs font-medium';
        statusBadge.querySelector('span').className = 'w-2 h-2 rounded-full bg-slate-400';
        statusText.textContent = '未接続';

        peerDisplayName.textContent = '接続相手: 未接続';
        callStatusSubtext.textContent = '上部バーから相手のコードを入力して接続してください';

        chatInput.disabled = true;
        sendMsgBtn.disabled = true;
        callTriggerBar.classList.add('opacity-50', 'pointer-events-none');
        disconnectBtn.classList.add('hidden');
      }
    }

    // PeerJS Setup
    function initPeerJS() {
      myPeerId = generateRoomCode();
      myRoomCodeEl.textContent = myPeerId;

      peer = new Peer(myPeerId);

      peer.on('open', (id) => {
        console.log('Peer ID Ready:', id);
      });

      peer.on('connection', (conn) => {
        setupDataConnection(conn);
      });

      peer.on('call', (call) => {
        mediaCall = call;

        mediaCall.on('stream', (remoteStream) => {
          remoteVideo.srcObject = remoteStream;
          remoteVideo.play().catch(() => {});
          if (remoteStream.getVideoTracks().length > 0) {
            remoteVideo.classList.remove('hidden');
            videoPlaceholder.classList.add('hidden');
          } else {
            activeCallRing.classList.remove('hidden');
          }
        });

        mediaCall.on('close', () => {
          endCallSession(false);
        });

        mediaCall.on('error', (err) => {
          console.error('MediaCall Error:', err);
          endCallSession(false);
        });
      });

      peer.on('error', (err) => {
        console.error('PeerJS Error:', err);
        showToast('接続エラーが発生しました', 'fa-triangle-exclamation');
        setConnectionStatus('disconnected');
      });
    }

    function setupDataConnection(conn) {
      dataConn = conn;

      dataConn.on('open', () => {
        setConnectionStatus('connected', dataConn.peer);
        showToast(`相手 (${dataConn.peer}) と接続しました！`, 'fa-circle-check');
      });

      dataConn.on('data', (data) => {
        handleIncomingData(data);
      });

      dataConn.on('close', () => {
        showToast('切断されました', 'fa-plug-circle-xmark');
        endCallSession(false);
        setConnectionStatus('disconnected');
      });
    }

    function connectToPeer(targetId) {
      if (!targetId || targetId === myPeerId) {
        showToast('有効な相手のコードを入力してください', 'fa-triangle-exclamation');
        return;
      }
      setConnectionStatus('connecting');
      const conn = peer.connect(targetId);
      setupDataConnection(conn);
    }

    connectBtn.addEventListener('click', () => {
      const code = targetCodeInput.value.trim().toUpperCase();
      connectToPeer(code);
    });

    disconnectBtn.addEventListener('click', () => {
      endCallSession(true);
      if (dataConn) {
        dataConn.close();
        dataConn = null;
      }
      setConnectionStatus('disconnected');
      showToast('切断しました');
    });

    copyCodeBtn.addEventListener('click', () => {
      document.execCommand('copy');
      navigator.clipboard.writeText(myPeerId).catch(() => {});
      showToast(`コード (${myPeerId}) をコピーしました`);
    });

    function sendSignal(type, payload = {}) {
      if (dataConn && dataConn.open) {
        dataConn.send({ type, ...payload });
      }
    }

    function handleIncomingData(data) {
      switch (data.type) {
        case 'CHAT_MSG':
          appendChatMessage('相手', data.content, data.time, false);
          break;

        case 'CALL_INVITE': // Continuous Ringing Start
          activeCallType = data.isVideo ? 'video' : 'audio';
          incomingCallType.textContent = data.isVideo ? 'ビデオ通話の着信です' : '音声通話の着信です';
          incomingCallIcon.className = data.isVideo ? 'fa-solid fa-video' : 'fa-solid fa-phone-volume';
          incomingCallModal.classList.remove('hidden');
          soundEffect.startIncomingRingtone(); // Loop sound until answer/reject
          break;

        case 'CALL_CANCEL': // Caller canceled
          soundEffect.stop();
          incomingCallModal.classList.add('hidden');
          showToast('呼び出しがキャンセルされました');
          break;

        case 'CALL_REJECT': // Callee rejected call
          soundEffect.stop();
          outgoingCallModal.classList.add('hidden');
          showToast('通話が拒否されました', 'fa-phone-slash');
          break;

        case 'CALL_ACCEPT': // Callee accepted
          soundEffect.stop();
          outgoingCallModal.classList.add('hidden');
          startOutgoingCallStream();
          break;

        case 'HANGUP':
          endCallSession(false);
          showToast('通話が終了しました');
          break;
      }
    }

    // Call Initiation Controls
    function initiateCall(isVideo) {
      if (!dataConn || !dataConn.open) {
        showToast('相手と接続されていません', 'fa-triangle-exclamation');
        return;
      }

      activeCallType = isVideo ? 'video' : 'audio';
      outgoingCallType.textContent = isVideo ? 'ビデオ通話の応答を待っています...' : '音声通話の応答を待っています...';
      outgoingCallIcon.className = isVideo ? 'fa-solid fa-video' : 'fa-solid fa-phone';
      outgoingCallModal.classList.remove('hidden');

      soundEffect.startOutgoingCallingTone(); // Continuous calling tone
      sendSignal('CALL_INVITE', { isVideo });
    }

    startAudioCallBtn.addEventListener('click', () => initiateCall(false));
    startVideoCallBtn.addEventListener('click', () => initiateCall(true));

    cancelCallBtn.addEventListener('click', () => {
      soundEffect.stop();
      outgoingCallModal.classList.add('hidden');
      sendSignal('CALL_CANCEL');
    });

    rejectCallBtn.addEventListener('click', () => {
      soundEffect.stop();
      incomingCallModal.classList.add('hidden');
      sendSignal('CALL_REJECT');
    });

    acceptCallBtn.addEventListener('click', () => {
      soundEffect.stop();
      incomingCallModal.classList.add('hidden');
      sendSignal('CALL_ACCEPT');
      startIncomingCallStream();
    });

    async function startOutgoingCallStream() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: activeCallType === 'video'
        });

        if (activeCallType === 'video') {
          localVideo.srcObject = localStream;
          localVideo.play().catch(() => {});
          localVideoWrapper.classList.remove('hidden');
        }

        updateMicButtonUI();
        updateCamButtonUI();

        inCallControls.classList.remove('hidden');
        callTriggerBar.classList.add('hidden');

        mediaCall = peer.call(dataConn.peer, localStream);

        mediaCall.on('stream', (remoteStream) => {
          remoteVideo.srcObject = remoteStream;
          remoteVideo.play().catch(() => {});
          if (remoteStream.getVideoTracks().length > 0) {
            remoteVideo.classList.remove('hidden');
            videoPlaceholder.classList.add('hidden');
          } else {
            activeCallRing.classList.remove('hidden');
          }
        });

        mediaCall.on('close', () => {
          endCallSession(false);
        });

        mediaCall.on('error', (err) => {
          console.error('MediaCall Error:', err);
          endCallSession(false);
        });

        showToast('通話を開始しました', 'fa-phone');
      } catch (err) {
        console.error('Stream error:', err);
        showToast('マイク/カメラの取得に失敗しました', 'fa-triangle-exclamation');
        endCallSession(true);
      }
    }

    async function startIncomingCallStream() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: activeCallType === 'video'
        });

        if (activeCallType === 'video') {
          localVideo.srcObject = localStream;
          localVideo.play().catch(() => {});
          localVideoWrapper.classList.remove('hidden');
        }

        updateMicButtonUI();
        updateCamButtonUI();

        inCallControls.classList.remove('hidden');
        callTriggerBar.classList.add('hidden');

        // MediaConnection（WebRTCオファー）の到着を最大3秒非同期待機
        if (!mediaCall) {
          let checkCount = 0;
          while (!mediaCall && checkCount < 30) {
            await new Promise(resolve => setTimeout(resolve, 100));
            checkCount++;
          }
        }

        if (mediaCall) {
          mediaCall.answer(localStream);
        } else {
          showToast('通話接続に失敗しました', 'fa-triangle-exclamation');
          endCallSession(true);
          return;
        }

        showToast('通話を開始しました', 'fa-phone');
      } catch (err) {
        console.error('Stream error:', err);
        showToast('マイク/カメラの取得に失敗しました', 'fa-triangle-exclamation');
        endCallSession(true);
      }
    }

    function endCallSession(notifyRemote = true) {
      if (notifyRemote) {
        sendSignal('HANGUP');
      }

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      if (remoteVideo.srcObject) {
        const tracks = remoteVideo.srcObject.getTracks ? remoteVideo.srcObject.getTracks() : [];
        tracks.forEach(t => t.stop());
        remoteVideo.srcObject = null;
      }
      if (localVideo.srcObject) {
        localVideo.srcObject = null;
      }

      if (mediaCall) {
        mediaCall.close();
        mediaCall = null;
      }

      // マイク・カメラの制御状態とUIアイコンの完全リセット（白＝ON状態に戻す）
      isMicMuted = false;
      isCamOff = false;
      updateMicButtonUI();
      updateCamButtonUI();

      remoteVideo.classList.add('hidden');
      localVideoWrapper.classList.add('hidden');
      videoPlaceholder.classList.remove('hidden');
      activeCallRing.classList.add('hidden');
      inCallControls.classList.add('hidden');
      callTriggerBar.classList.remove('hidden');

      soundEffect.stop();
      outgoingCallModal.classList.add('hidden');
      incomingCallModal.classList.add('hidden');
    }

    hangupBtn.addEventListener('click', () => {
      endCallSession(true);
      showToast('通話を終了しました');
    });

    // マイク・カメラのUI更新用ヘルパー関数（白＝ON、赤＝OFFを徹底）
    function updateMicButtonUI() {
      if (isMicMuted) {
        // OFF: 赤ベース
        toggleMicBtn.className = 'w-10 h-10 rounded-full bg-red-600 text-white flex items-center justify-center transition border border-red-600 shadow-md';
        toggleMicBtn.innerHTML = '<i class="fa-solid fa-microphone-slash text-sm"></i>';
      } else {
        // ON: 白ベース
        toggleMicBtn.className = 'w-10 h-10 rounded-full bg-white dark:bg-zinc-800 text-slate-700 dark:text-zinc-200 flex items-center justify-center transition border border-slate-300 dark:border-zinc-700 shadow-sm hover:bg-slate-50 dark:hover:bg-zinc-700';
        toggleMicBtn.innerHTML = '<i class="fa-solid fa-microphone text-sm"></i>';
      }
    }

    function updateCamButtonUI() {
      if (isCamOff) {
        // OFF: 赤ベース
        toggleCamBtn.className = 'w-10 h-10 rounded-full bg-red-600 text-white flex items-center justify-center transition border border-red-600 shadow-md';
        toggleCamBtn.innerHTML = '<i class="fa-solid fa-video-slash text-sm"></i>';
      } else {
        // ON: 白ベース
        toggleCamBtn.className = 'w-10 h-10 rounded-full bg-white dark:bg-zinc-800 text-slate-700 dark:text-zinc-200 flex items-center justify-center transition border border-slate-300 dark:border-zinc-700 shadow-sm hover:bg-slate-50 dark:hover:bg-zinc-700';
        toggleCamBtn.innerHTML = '<i class="fa-solid fa-video text-sm"></i>';
      }
    }

    toggleMicBtn.addEventListener('click', () => {
      if (localStream && localStream.getAudioTracks().length > 0) {
        isMicMuted = !isMicMuted;
        localStream.getAudioTracks()[0].enabled = !isMicMuted;
        updateMicButtonUI();
      }
    });

    toggleCamBtn.addEventListener('click', () => {
      if (localStream && localStream.getVideoTracks().length > 0) {
        isCamOff = !isCamOff;
        localStream.getVideoTracks()[0].enabled = !isCamOff;
        updateCamButtonUI();
      }
    });

    // Chat Message Logic
    function formatTime() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendChatMessage(sender, text, time, isSelf) {
      const msgWrap = document.createElement('div');
      msgWrap.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'}`;

      const msgBubble = document.createElement('div');
      msgBubble.className = isSelf 
        ? 'bg-blue-600 text-white px-3 py-1.5 rounded-xl rounded-tr-none max-w-[85%] break-words shadow-sm'
        : 'bg-slate-200 dark:bg-zinc-700 text-slate-800 dark:text-zinc-100 px-3 py-1.5 rounded-xl rounded-tl-none max-w-[85%] break-words shadow-sm';
      msgBubble.textContent = text;

      const timeSpan = document.createElement('span');
      timeSpan.className = 'text-[10px] text-slate-400 mt-0.5 px-0.5';
      timeSpan.textContent = time;

      msgWrap.appendChild(msgBubble);
      msgWrap.appendChild(timeSpan);
      chatMessages.appendChild(msgWrap);

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const content = chatInput.value.trim();
      if (!content) return;

      const time = formatTime();
      appendChatMessage('自分', content, time, true);
      sendSignal('CHAT_MSG', { content, time });

      chatInput.value = '';
    });

    clearChatBtn.addEventListener('click', () => {
      chatMessages.innerHTML = `
        <div class="text-center text-xs text-slate-400 my-auto py-4">
          チャット履歴を消去しました
        </div>
      `;
    });

    // Initialize application
    window.onload = () => {
      initPeerJS();
    };
  </script>
</body>
</html>
